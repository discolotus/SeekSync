name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify publishing runner
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
      - name: Test
        run: make test
      - name: Package release
        run: make release
      - name: Verify package
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          archive="dist/release/SeekSync-${version}-arm64.zip"
          test -f "$archive"
          (
            cd dist/release
            shasum -a 256 -c "SeekSync-${version}-arm64.zip.sha256"
          )
          codesign --verify --deep --strict "dist/SeekSync.app"
          test "$(lipo -archs 'dist/SeekSync.app/Contents/MacOS/SeekSyncPrototype')" = arm64
          test "$(plutil -extract CFBundleIconFile raw 'dist/SeekSync.app/Contents/Info.plist')" = AppIcon
          cmp Resources/AppIcon.icns "dist/SeekSync.app/Contents/Resources/AppIcon.icns"
          iconutil -c iconset Resources/AppIcon.icns -o "$RUNNER_TEMP/AppIcon.iconset"
          ruby -c dist/release/seeksync.rb
          mkdir -p "$RUNNER_TEMP/homebrew-tap/Casks"
          cp dist/release/seeksync.rb "$RUNNER_TEMP/homebrew-tap/Casks/seeksync.rb"
          brew style "$RUNNER_TEMP/homebrew-tap/Casks/seeksync.rb"
      - name: Install and launch release bundle
        run: make test-packaged-app
